# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Dev

on:
  push:
    branches: [ "master", "v2", "v3" ]
  pull_request:
    branches: [ "master", "v2", "v3" ]

jobs:
  lint-test-build-linux:
    name: Lint-Test-Build-Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: golangci-lint
        run: make lint

      - name: Test (race)
        run: make test-race

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

      - name: Build (all platforms)
        run: make build

      - name: Build Android AAR
        run: make easyss-android-aar

  test-macos:
    name: Test-MacOS
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: golangci-lint
        run: make lint

      - name: Test (race)
        run: make test-race

  test-windows:
    name: Test-Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: golangci-lint
        run: make lint

      - name: Test (race)
        run: make test-race

  test-windows-arm64:
    name: Test-Windows-Arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # The Go race detector is not supported on windows/arm64 (only
      # windows/amd64), so this job runs the plain tests with a longer
      # timeout suited to the ARM runner.
      - name: Test
        run: go test -v -timeout 30m ./...

  test-headless-linux:
    name: Test-Headless-Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # headless (Android / no tray) only changes which files compile into
      # cmd/easyss; every other package is identical under the tag. The target
      # vets the whole module with it (which is what catches a test file
      # referencing a tray-only symbol) and runs the cmd/easyss tests.
      - name: Test (race)
        run: make test-race-headless
