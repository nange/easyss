# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Dev

on:
  push:
    branches: [ "master", "v2", "v3" ]
  pull_request:
    branches: [ "master", "v2", "v3" ]

jobs:
  lint-test-build-linux:
    name: Lint-Test-Build-Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: golangci-lint
        run: make lint

      - name: Test
        run: make test

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

      - name: Build
        run: make .PHONY

      - name: Build Linux Arm64
        run: |
          GOOS=linux GOARCH=arm64 make easyss
          GOOS=linux GOARCH=arm64 make easyss-server

  test-macos:
    name: Test-MacOS
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: golangci-lint
        run: make lint

      - name: Test
        run: make test

  test-windows:
    name: Test-Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: golangci-lint
        run: make lint

      - name: Test
        run: go test -v ./...

  test-windows-arm64:
    name: Test-Windows-Arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Test
        run: go test -v ./...
