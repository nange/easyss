name: Nightly Release

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

      - name: Build
        run: make .PHONY

      - name: Pack
        run: |
          cd bin
          zip easyss-linux-amd64.zip ./easyss
          zip easyss-windows-amd64.zip ./easyss.exe
          zip easyss-without-tray-linux-amd64.zip ./easyss-without-tray
          zip easyss-server-linux-amd64.zip ./easyss-server
          zip easyss-server-windows-amd64.zip ./easyss-server.exe

      - name: Build Arm64
        run: |
          GOOS=linux GOARCH=arm64 make easyss-without-tray
          GOOS=linux GOARCH=arm64 make easyss-server
          GOOS=windows GOARCH=arm64 make easyss-server
      - name: Pack Arm64
        run: |
          cd bin
          zip easyss-without-tray-linux-arm64.zip ./easyss-without-tray
          zip easyss-server-linux-arm64.zip ./easyss-server
          zip easyss-server-windows-arm64.zip ./easyss-server.exe

      - name: Set outputs
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp_minute=$(date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          name: Nightly-${{ steps.vars.outputs.timestamp_minute }}-${{ steps.vars.outputs.sha_short }}
          tag_name: nightly-${{ steps.vars.outputs.sha_short }}
          prerelease: true
          body: For testing and development only
          files: |
            bin/*.zip
            bin/*.aar

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Arm64
        shell: bash
        run: |
          cd cmd/easyss
          go build -ldflags "-H=windowsgui -X 'github.com/nange/easyss/v3/version.Name=Easyss' -X 'github.com/nange/easyss/v3/version.BuildDate=$(date "+%Y-%m-%d %H:%M:%S")' -X 'github.com/nange/easyss/v3/version.GitTag=$(git describe --tags)'" -o ../../bin/easyss.exe
          cd ../easyss-server
          CGO_ENABLED=0 go build -ldflags "-X 'github.com/nange/easyss/v3/version.Name=Easyss' -X 'github.com/nange/easyss/v3/version.BuildDate=$(date "+%Y-%m-%d %H:%M:%S")' -X 'github.com/nange/easyss/v3/version.GitTag=$(git describe --tags)'" -o ../../bin/easyss-server.exe

      - name: Pack Arm64
        shell: pwsh
        run: |
          cd bin
          Compress-Archive -Path ./easyss.exe -DestinationPath easyss-windows-arm64.zip
          Compress-Archive -Path ./easyss-server.exe -DestinationPath easyss-server-windows-arm64.zip

      - name: Set outputs
        id: vars
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp_minute=$(date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          name: Nightly-${{ steps.vars.outputs.timestamp_minute }}-${{ steps.vars.outputs.sha_short }}
          tag_name: nightly-${{ steps.vars.outputs.sha_short }}
          prerelease: true
          body: For testing and development only
          files: bin/*.zip

  macos-arm64:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Arm64
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          GOOS=darwin GOARCH=arm64 make easyss-mac-app
          GOOS=darwin GOARCH=arm64 make easyss-server

      - name: Pack Arm64
        run: |
          cd bin
          zip -r easyss-darwin-arm64.zip ./Easyss.app
          zip easyss-server-darwin-arm64.zip ./easyss-server

      - name: Set outputs
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp_minute=$(date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          name: Nightly-${{ steps.vars.outputs.timestamp_minute }}-${{ steps.vars.outputs.sha_short }}
          tag_name: nightly-${{ steps.vars.outputs.sha_short }}
          prerelease: true
          body: For testing and development only
          files: bin/*.zip

  macos-amd64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Amd64
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          GOOS=darwin GOARCH=amd64 make easyss-mac-app
          GOOS=darwin GOARCH=amd64 make easyss-server

      - name: Pack Amd64
        run: |
          cd bin
          zip -r easyss-darwin-amd64.zip ./Easyss.app
          zip easyss-server-darwin-amd64.zip ./easyss-server

      - name: Set outputs
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp_minute=$(date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          name: Nightly-${{ steps.vars.outputs.timestamp_minute }}-${{ steps.vars.outputs.sha_short }}
          tag_name: nightly-${{ steps.vars.outputs.sha_short }}
          prerelease: true
          body: For testing and development only
          files: bin/*.zip
