name: Nightly Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

      # 发布前显式校验（构建步骤本身不再顺带跑 lint/测试）
      - name: Verify (lint + tests)
        run: make verify

      # 一次产出全部平台二进制、14 个 zip 与 Android AAR（见 Makefile 的 build/pack/dist）
      - name: Build release assets
        run: make dist

      - name: Set outputs
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp_minute=$(date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          name: Nightly-${{ steps.vars.outputs.timestamp_minute }}-${{ steps.vars.outputs.sha_short }}
          tag_name: nightly-${{ steps.vars.outputs.sha_short }}
          prerelease: true
          generate_release_notes: true
          files: |
            bin/*.zip
            bin/*.aar
